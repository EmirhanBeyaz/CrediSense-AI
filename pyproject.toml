[project]
name = "credisense-ai"
version = "0.1.0"
description = "Katmanli kredi on degerlendirme prototipi"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "scikit-learn>=1.8.0",
  "fastapi>=0.115.0",
  "python-multipart>=0.0.9",
  "uvicorn>=0.30.0",
  "PyMuPDF>=1.24.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --basetemp=.pytest_tmp"

[tool.ruff]
line-length = 100
target-version = "py310"
